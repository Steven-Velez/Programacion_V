<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listado - Proyectos</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body data-table="proyectos">
    <header>
        <h1>Sistema de Gestión — Base de Datos Proyectos</h1>
        <p class="subtitulo">Listado de Proyectos</p>
    </header>

    <nav class="tabs-container">
        <a href="index.html" class="tab-btn">Inicio / Pestañas</a>
        <a href="ciudades.html" class="tab-btn">Ciudades</a>
        <a href="clientes.html" class="tab-btn">Clientes</a>
        <a href="oficinas.html" class="tab-btn">Oficinas</a>
        <a href="proyectos.html" class="tab-btn active">Proyectos</a>
    </nav>

    <div class="table-wrapper">
        <div class="table-header-info">
            <span class="table-title" id="titulo-tabla">Listado de Proyectos</span>
            <span class="record-count" id="contador-registros">Cargando...</span>
        </div>
        <table>
            <thead id="encabezado">
                <tr>
                    <th>Id</th>
                    <th>Proyecto</th>
                    <th>Cliente</th>
                    <th>Oficina</th>
                    <th>Fecha Inicio</th>
                    <th>Fecha Fin</th>
                    <th>Costo</th>
                </tr>
            </thead>
            <tbody id="resultado">
                <tr>
                    <td colspan="7" class="loading">Cargando datos...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script src="app.js"></script>
</body>
</html>
