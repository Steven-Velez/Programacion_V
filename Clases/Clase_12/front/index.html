<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
    <main class="card" aria-labelledby="table-title">
        <header class="card-header">
            <h1 class="table-title">Información de Ciudades</h1>
        </header>
        <div class="card-body">
            <div class="toolbar">
                <button id="add-city-button" class="primary-button" type="button">Adicionar</button>
            </div>
            <div class="table-container" role="region" aria-label="Employees" tabindex="0">
                <colgroup><col class="name-column"><col   class="position-column"><col  class="office-column"> <col class="salary-column"></colgroup>
                <table>
                    <thead>
                        <th scope="col" aria-sort="ascending">Id</th>
                        <th scope="col" aria-sort="none">Ciudad</th>
                        <th scope="col" aria-sort="none">País</th>
                        <th scope="col" aria-sort="none">Operaciones</th>
                    </thead>
                    <tbody id="table-body">
                        <tr>
                            <td>Airi Satou</td>
                            <td>Accountant</td>
                            <td>Tokyo</td>
                            <td>162700</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div class="table-footer"></div>
        </div>
    </main>
    <formulario-ciudad id="city-form"></formulario-ciudad>
</body>
</html>
<script src="./componentes/formulario-ciudad.js"></script>
<script src="./table.js"></script>
